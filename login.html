<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Kacungers</title>
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="brand">
      <span class="seal">KG</span>
      <span class="brand-name">KACUNGERS</span>
    </a>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <span class="sticker-badge sticker-badge--corner">MASUK</span>
      <h1 class="auth-title">Selamat balik, kacungers.</h1>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="kamu@email.com">

        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">

        <p class="auth-error" id="loginError"></p>

        <button type="submit" class="btn-solid">Masuk</button>
      </form>
      <p class="auth-switch">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
    </div>
  </main>

  <script src="js/auth.js" type="module"></script>
</body>
</html>

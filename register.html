<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — Kacungers</title>
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="brand">
      <span class="seal">KG</span>
      <span class="brand-name">KACUNGERS</span>
    </a>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <span class="sticker-badge sticker-badge--corner">DAFTAR</span>
      <h1 class="auth-title">Gabung jadi kacungers.</h1>
      <form id="registerForm">
        <label for="name">Nama</label>
        <input type="text" id="name" required placeholder="Nama kamu">

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="kamu@email.com">

        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Minimal 6 karakter">

        <p class="auth-error" id="registerError"></p>

        <button type="submit" class="btn-solid">Daftar</button>
      </form>
      <p class="auth-switch">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </div>
  </main>

  <script src="js/auth.js" type="module"></script>
</body>
</html>
